# Render Blueprint: one web service that runs the API and serves the React build.
# In Render: New > Blueprint > pick your GitHub repo. You only have to paste MONGO_URI.
services:
  - type: web
    name: carebed
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false          # paste your MongoDB Atlas connection string in the dashboard
      - key: JWT_SECRET
        generateValue: true  # Render creates a random secret for you
      - key: ADMIN_EMAIL
        value: anasgada512@gmail.com
